# Keeps data/bbb-sdk-versions.json in step with the BigBlueButton releases.
# Opens (or updates) a PR; the change needs a human review like any data change.
name: Update the BBB to SDK table
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app-token
        with:
          app-id: ${{ vars.DIRECTORY_APP_ID }}
          private-key: ${{ secrets.DIRECTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Clone BigBlueButton tags (no blobs until needed)
        run: git clone --quiet --filter=blob:none --no-checkout https://github.com/bigbluebutton/bigbluebutton.git "$RUNNER_TEMP/bbb"
      - run: node src/cli/generate-sdk-table.mjs --bbb-repo "$RUNNER_TEMP/bbb"
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- data/bbb-sdk-versions.json; then echo 'Table is up to date'; exit 0; fi
          branch=bot/bbb-sdk-table
          git config user.name 'bbb-plugin-directory[bot]'
          git config user.email 'bbb-plugin-directory[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git commit -m 'data: update the BBB to plugin SDK table' -- data/bbb-sdk-versions.json
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --title 'Update the BBB to plugin SDK table' \
              --body "New BigBlueButton releases. Check minSupported of each line before merging: stable URLs only move to plugin versions that work on every release from it on."
          fi
