# The deploy bot: merges deploy requests without human review once every check
# passes, then dispatches Publish. Woken when the verification build or the CI
# of a PR finishes (so a merge refused while a required check was still running
# is retried). Reads data only; never checks out or runs PR code.
name: Bot - merge deploy requests
on:
  workflow_run:
    workflows: [Verify build, CI]
    types: [completed]
permissions: {}
concurrency:
  group: bot-merge-${{ github.event.workflow_run.head_sha }}
jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: node src/cli/bot-merge.js
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
